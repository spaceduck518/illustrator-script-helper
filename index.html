<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Script Helper</title>
    <style>
        :root {
            --bg: #323232;
            --fg: #e0e0e0;
            --muted: #9a9a9a;
            --line: #444;
            --hover: #3e3e3e;
            --accent: #378ef0;
            --error: #ff6b6b;
            --ok: #6fcf7f;
        }
        :root.light {
            --bg: #f0f0f0;
            --fg: #222;
            --muted: #6e6e6e;
            --line: #cfcfcf;
            --hover: #e2e2e2;
            --accent: #1473e6;
            --error: #c9252d;
            --ok: #2d7d3a;
        }

        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 12px;
        }

        body {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 8px;
            border-bottom: 1px solid var(--line);
        }

        .folder {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            direction: rtl;          /* lange Pfade vorne kürzen, Ordnername bleibt sichtbar */
            text-align: left;
            color: var(--muted);
        }

        button {
            background: transparent;
            color: var(--fg);
            border: 1px solid var(--line);
            border-radius: 3px;
            padding: 2px 7px;
            font-size: 12px;
            cursor: pointer;
        }
        button:hover { background: var(--hover); }

        .options {
            display: flex;
            align-items: center;
            padding: 4px 8px;
            border-bottom: 1px solid var(--line);
            color: var(--muted);
        }
        #filter {
            flex: 1;
            min-width: 0;
            background: transparent;
            color: var(--fg);
            border: 1px solid var(--line);
            border-radius: 3px;
            padding: 2px 5px;
            font-size: 12px;
        }
        #filter:focus { outline: none; border-color: var(--accent); }

        #menu {
            position: fixed;
            z-index: 10;
            min-width: 140px;
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 3px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
            padding: 3px 0;
        }
        #menu div {
            padding: 4px 12px;
            cursor: pointer;
            white-space: nowrap;
        }
        #menu div:hover { background: var(--accent); color: #fff; }

        #list li.menu-target { background: var(--hover); }

        /* Einstellungen als Pop-up über dem Panel (wie in VectorTeX Pro) */
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            align-items: center;
            justify-content: center;
        }
        .modal.show { display: flex; }

        .modal-content {
            position: relative;
            width: 90%;
            max-width: 340px;
            max-height: 90%;
            overflow-y: auto;
            padding: 12px 14px;
            background: var(--bg);
            border: 1px solid var(--line);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }
        .modal-content h3 {
            margin: 0 0 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--line);
            font-size: 13px;
            font-weight: 600;
        }
        .modal-close {
            position: absolute;
            top: 8px;
            right: 12px;
            font-size: 16px;
            font-weight: bold;
            color: var(--muted);
            cursor: pointer;
        }
        .modal-close:hover { color: var(--fg); }
        .field-label {
            display: block;
            margin: 10px 0 3px;
            color: var(--muted);
        }
        .field {
            display: flex;
            gap: 4px;
        }
        .field input {
            flex: 1;
            min-width: 0;
            background: transparent;
            color: var(--fg);
            border: 1px solid var(--line);
            border-radius: 3px;
            padding: 3px 5px;
            font-size: 12px;
        }
        .field input:focus { outline: none; border-color: var(--accent); }
        .check {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 8px;
            cursor: pointer;
        }
        .hint {
            margin-top: 4px;
            font-size: 10px;
            color: var(--muted);
        }
        .hint a { color: var(--accent); }
        .row2 {
            display: flex;
            gap: 8px;
        }
        .row2 > div { flex: 1; min-width: 0; }
        select {
            width: 100%;
            background: var(--bg);
            color: var(--fg);
            border: 1px solid var(--line);
            border-radius: 3px;
            padding: 2px 3px;
            font-size: 12px;
        }
        select:focus { outline: none; border-color: var(--accent); }
        .msg {
            margin-top: 10px;
            color: var(--error);
            word-break: break-word;
        }
        .msg:empty { display: none; }
        .actions {
            display: flex;
            gap: 6px;
            margin: 12px 0 8px;
        }
        button.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        button.primary:hover { filter: brightness(1.1); background: var(--accent); }

        #list {
            flex: 1;
            overflow-y: auto;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        #list li {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 8px;
            border-bottom: 1px solid var(--line);
        }
        #list li:hover { background: var(--hover); }

        .text {
            flex: 1;
            min-width: 0;            /* sonst greift text-overflow nicht */
        }

        button.run {
            flex: none;
            font-size: 11px;
            padding: 2px 6px;
        }
        button.run:hover:not(:disabled) {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        button.run:disabled {
            opacity: 0.4;
            cursor: default;
        }

        .name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .meta {
            font-size: 10px;
            color: var(--muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Seit dem Öffnen des Panels aufgetaucht oder geändert */
        #list li.fresh { box-shadow: inset 3px 0 0 var(--accent); }
        #list li.running { background: var(--hover); font-style: italic; }

        #result {
            padding: 5px 8px;
            border-top: 1px solid var(--line);
            font-size: 11px;
            word-break: break-word;
            user-select: text;       /* Fehlermeldung kopierbar */
        }
        #result.busy { color: var(--muted); }
        #result.ok { color: var(--ok); }
        #result.error { color: var(--error); }
        #result.info { color: var(--accent); }
        button.setup { margin-top: 8px; }

        .empty {
            padding: 12px 8px;
            color: var(--muted);
        }

        #status {
            padding: 4px 8px;
            border-top: 1px solid var(--line);
            color: var(--muted);
            font-size: 11px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #status.error { color: var(--error); }
    </style>
</head>
<body>
    <div class="toolbar">
        <span class="folder" id="folder"></span>
        <button id="btnConfig" data-i18n-title="settings">&#x2699;</button>
    </div>
    <div id="settingsModal" class="modal">
    <form id="settings" class="modal-content">
        <span id="setClose" class="modal-close" data-i18n-title="close">&times;</span>
        <h3 data-i18n="settings"></h3>

        <label class="field-label" for="setFolder" data-i18n="lblFolder"></label>
        <div class="field">
            <input type="text" id="setFolder" spellcheck="false">
            <button type="button" id="setFolderBrowse" data-i18n-title="browseFolder">&#x2026;</button>
        </div>

        <label class="check"><input type="checkbox" id="setSub"> <span data-i18n="lblSub"></span></label>

        <label class="field-label" for="setEditor" data-i18n="lblEditor"></label>
        <div class="field">
            <input type="text" id="setEditor" spellcheck="false" data-i18n-placeholder="editorPlaceholder">
            <button type="button" id="setEditorBrowse" data-i18n-title="browseEditor">&#x2026;</button>
        </div>
        <div class="hint" id="setEditorHint"></div>

        <div class="row2">
            <div>
                <label class="field-label" for="setLanguage" data-i18n="lblLanguage"></label>
                <select id="setLanguage">
                    <option value="auto" data-i18n="langAuto"></option>
                    <option value="de">Deutsch</option>
                    <option value="en">English</option>
                </select>
            </div>
            <div>
                <label class="field-label" for="setTheme" data-i18n="lblTheme"></label>
                <select id="setTheme">
                    <option value="auto" data-i18n="themeAuto"></option>
                    <option value="light" data-i18n="themeLight"></option>
                    <option value="dark" data-i18n="themeDark"></option>
                </select>
            </div>
        </div>

        <div class="msg" id="setMsg"></div>

        <div class="actions">
            <button type="submit" class="primary" data-i18n="save"></button>
            <button type="button" id="setCancel" data-i18n="cancel"></button>
        </div>

        <div class="hint">
            <span data-i18n="savedIn"></span> <a href="#" id="setOpenFile">config.json</a>.
            <span data-i18n="cfgFileHint"></span>
        </div>
    </form>
    </div>
    <div class="options">
        <input type="search" id="filter" data-i18n-placeholder="filter">
    </div>
    <ul id="list"></ul>
    <div id="menu" hidden>
        <div data-action="run" data-i18n="menuRun"></div>
        <div data-action="edit" data-i18n="menuEdit"></div>
        <div data-action="reveal" data-i18n="menuReveal"></div>
        <div data-action="move" data-i18n="menuMove" data-i18n-title="menuMoveTitle"></div>
        <div data-action="copy" data-i18n="menuCopy"></div>
    </div>
    <div id="result" hidden></div>
    <div id="status"></div>

    <script src="CSInterface.js"></script>
    <script src="i18n.js"></script>
    <script src="config.js"></script>
    <script src="scanner.js"></script>
    <script src="main.js"></script>
</body>
</html>
